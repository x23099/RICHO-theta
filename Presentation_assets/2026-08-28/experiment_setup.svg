<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      text { font-family: "Noto Sans CJK JP", "Yu Gothic", sans-serif; fill: #172033; }
      .title { font-size: 44px; font-weight: 700; }
      .subtitle { font-size: 24px; fill: #4a5568; }
      .label { font-size: 25px; font-weight: 700; }
      .small { font-size: 21px; }
      .note { font-size: 20px; fill: #4a5568; }
      .axis { stroke: #526071; stroke-width: 4; marker-end: url(#arrow); }
      .guide { stroke: #aeb8c5; stroke-width: 2; stroke-dasharray: 10 9; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#526071"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#f7f9fc"/>
  <text x="70" y="72" class="title">実験配置：360度カメラで青箱の位置と遮蔽を評価</text>
  <text x="72" y="112" class="subtitle">Kobukiを停止し、既知位置へ青箱を置いて検出・追跡・処理速度を記録</text>

  <rect x="65" y="150" width="1050" height="680" rx="28" fill="#ffffff" stroke="#d8dee8" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="195" class="label">上から見た配置</text>

  <!-- Coordinate guides: 300 px/m, origin (575,730) -->
  <line x1="575" y1="730" x2="575" y2="235" class="axis"/>
  <line x1="335" y1="730" x2="835" y2="730" class="axis"/>
  <text x="595" y="254" class="label">z（前方）</text>
  <text x="800" y="770" class="label">+x（右）</text>
  <text x="265" y="770" class="label">−x（左）</text>

  <line x1="300" y1="460" x2="850" y2="460" class="guide"/>
  <line x1="300" y1="370" x2="850" y2="370" class="guide"/>
  <line x1="485" y1="235" x2="485" y2="745" class="guide"/>
  <line x1="665" y1="235" x2="665" y2="745" class="guide"/>
  <text x="865" y="467" class="small">z=0.9 m</text>
  <text x="865" y="377" class="small">z=1.2 m</text>
  <text x="438" y="795" class="small">−0.3 m</text>
  <text x="637" y="795" class="small">+0.3 m</text>

  <!-- Kobuki -->
  <circle cx="575" cy="700" r="74" fill="#27364a" stroke="#101827" stroke-width="5"/>
  <circle cx="575" cy="700" r="25" fill="#edf2f7" stroke="#87a0bd" stroke-width="4"/>
  <path d="M575 655 L555 690 L595 690 Z" fill="#f6c344"/>
  <text x="575" y="810" class="label" text-anchor="middle">Kobuki＋360度カメラ</text>

  <!-- Target boxes -->
  <g filter="url(#shadow)">
    <rect x="437" y="420" width="96" height="80" rx="8" fill="#1769d2" stroke="#0b438c" stroke-width="4"/>
    <rect x="617" y="420" width="96" height="80" rx="8" fill="#1769d2" stroke="#0b438c" stroke-width="4"/>
    <rect x="437" y="330" width="96" height="80" rx="8" fill="#4f91df" stroke="#1769d2" stroke-width="3" opacity="0.72"/>
    <rect x="617" y="330" width="96" height="80" rx="8" fill="#4f91df" stroke="#1769d2" stroke-width="3" opacity="0.72"/>
    <rect x="527" y="330" width="96" height="80" rx="8" fill="#1769d2" stroke="#0b438c" stroke-width="4"/>
  </g>
  <text x="485" y="448" class="small" text-anchor="middle" fill="#ffffff">左</text>
  <text x="485" y="478" class="small" text-anchor="middle" fill="#ffffff">−0.3, 0.9</text>
  <text x="665" y="448" class="small" text-anchor="middle" fill="#ffffff">右</text>
  <text x="665" y="478" class="small" text-anchor="middle" fill="#ffffff">+0.3, 0.9</text>
  <text x="575" y="360" class="small" text-anchor="middle" fill="#ffffff">中央</text>
  <text x="575" y="390" class="small" text-anchor="middle" fill="#ffffff">0, 1.2</text>

  <!-- Occluder -->
  <rect x="515" y="510" width="120" height="22" rx="6" fill="#2d3748"/>
  <line x1="575" y1="532" x2="575" y2="624" stroke="#2d3748" stroke-width="4" stroke-dasharray="8 7"/>
  <text x="660" y="528" class="small">遮蔽板を2回通す</text>
  <text x="660" y="557" class="note">検出消失 → 予測 → 失効 → 再捕捉</text>

  <!-- Right explanation card -->
  <rect x="1160" y="150" width="375" height="680" rx="28" fill="#ffffff" stroke="#d8dee8" stroke-width="2" filter="url(#shadow)"/>
  <text x="1200" y="207" class="label">記録するもの</text>
  <g class="small">
    <circle cx="1207" cy="256" r="8" fill="#1769d2"/><text x="1230" y="264">360度の生映像</text>
    <circle cx="1207" cy="306" r="8" fill="#29a36a"/><text x="1230" y="314">俯瞰・検出映像</text>
    <circle cx="1207" cy="356" r="8" fill="#ef8f22"/><text x="1230" y="364">推定位置・追跡状態</text>
    <circle cx="1207" cy="406" r="8" fill="#8b5cf6"/><text x="1230" y="414">ODOM・処理時間</text>
  </g>

  <line x1="1200" y1="455" x2="1495" y2="455" stroke="#d8dee8" stroke-width="2"/>
  <text x="1200" y="505" class="label">評価条件</text>
  <g class="small">
    <text x="1200" y="550">• 青箱なし（誤検出）</text>
    <text x="1200" y="595">• 中央・左右（検出率）</text>
    <text x="1200" y="640">• 遮蔽（追跡と再捕捉）</text>
    <text x="1200" y="685">• 別床（環境変化）</text>
    <text x="1200" y="730">• 30 fps・ODOM有効性</text>
  </g>

  <rect x="1195" y="760" width="305" height="44" rx="22" fill="#e9f3ff"/>
  <text x="1348" y="790" class="small" text-anchor="middle" fill="#1458a6">静止実験は開発確認PASS</text>
</svg>
