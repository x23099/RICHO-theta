<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      text { font-family: "Noto Sans CJK JP", "Yu Gothic", sans-serif; fill: #172033; }
      .title { font-size: 44px; font-weight: 700; }
      .subtitle { font-size: 24px; fill: #4a5568; }
      .head { font-size: 29px; font-weight: 700; }
      .body { font-size: 22px; fill: #39465a; }
      .metric { font-size: 34px; font-weight: 700; }
      .small { font-size: 19px; fill: #536173; }
      .arrow { stroke: #728096; stroke-width: 6; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#728096"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#f7f9fc"/>
  <text x="70" y="75" class="title">独立holdoutの失敗を、原因診断と追加実験で改善</text>
  <text x="72" y="116" class="subtitle">同じ録画に合わせて閾値を変更せず、原因を分離して新しい録画で確認</text>

  <path d="M505 430 L560 430" class="arrow"/>
  <path d="M1040 430 L1095 430" class="arrow"/>

  <!-- Before -->
  <rect x="65" y="170" width="440" height="570" rx="30" fill="#ffffff" stroke="#f1b7b7" stroke-width="3" filter="url(#shadow)"/>
  <rect x="65" y="170" width="440" height="90" rx="30" fill="#fff0f0"/>
  <rect x="65" y="225" width="440" height="35" fill="#fff0f0"/>
  <text x="285" y="227" class="head" text-anchor="middle" fill="#b4232b">① 独立holdout：総合FAIL</text>
  <text x="105" y="305" class="body">青箱なしで生候補を検出</text>
  <text x="105" y="353" class="metric" fill="#c52d35">754 / 818 frame</text>
  <text x="105" y="397" class="small">追跡・警告には伝播しなかったが事前条件違反</text>
  <line x1="105" y1="430" x2="465" y2="430" stroke="#ead4d4" stroke-width="2"/>
  <text x="105" y="485" class="body">実効30 fps±1%を満たした試行</text>
  <text x="105" y="533" class="metric" fill="#c52d35">3 / 6 trial</text>
  <text x="105" y="577" class="small">欠番ではなく、処理時間の継続超過</text>
  <rect x="105" y="625" width="360" height="78" rx="16" fill="#fff6f6"/>
  <text x="285" y="657" class="body" text-anchor="middle">観測ゲート単体は5/5 PASS</text>
  <text x="285" y="688" class="small" text-anchor="middle">本番設定は変更しない</text>

  <!-- Diagnosis and implementation -->
  <rect x="560" y="170" width="480" height="570" rx="30" fill="#ffffff" stroke="#f2cf91" stroke-width="3" filter="url(#shadow)"/>
  <rect x="560" y="170" width="480" height="90" rx="30" fill="#fff7e8"/>
  <rect x="560" y="225" width="480" height="35" fill="#fff7e8"/>
  <text x="800" y="227" class="head" text-anchor="middle" fill="#9a5a00">② 原因診断と開発実装</text>
  <text x="605" y="310" class="body">誤候補：ゴムマット上端の横長輪郭</text>
  <rect x="605" y="345" width="170" height="55" rx="8" fill="#28384c"/>
  <rect x="790" y="356" width="195" height="33" rx="7" fill="#1769d2" opacity="0.85"/>
  <text x="605" y="442" class="body">幅÷高さ</text>
  <text x="740" y="442" class="metric" fill="#d97706">1.545～5.800</text>
  <text x="605" y="480" class="small">真の青箱は0.565～1.393 → 上限1.5で分離</text>
  <line x1="605" y1="515" x2="995" y2="515" stroke="#eadfc9" stroke-width="2"/>
  <text x="605" y="565" class="body">追加したもの</text>
  <text x="625" y="610" class="body">• 横長輪郭除外</text>
  <text x="625" y="650" class="body">• 処理区間9項目の時間計測</text>
  <text x="625" y="690" class="body">• preflight連動ランチャー</text>

  <!-- After -->
  <rect x="1095" y="170" width="440" height="570" rx="30" fill="#ffffff" stroke="#9ed7b7" stroke-width="3" filter="url(#shadow)"/>
  <rect x="1095" y="170" width="440" height="90" rx="30" fill="#edf9f2"/>
  <rect x="1095" y="225" width="440" height="35" fill="#edf9f2"/>
  <text x="1315" y="227" class="head" text-anchor="middle" fill="#187044">③ 新しい静止録画：PASS</text>
  <text x="1140" y="305" class="body">箱なし（同じ床＋別床）</text>
  <text x="1495" y="305" class="metric" text-anchor="end" fill="#17824d">0 / 1298</text>
  <text x="1140" y="365" class="body">中央の青箱</text>
  <text x="1495" y="365" class="metric" text-anchor="end" fill="#17824d">646 / 646</text>
  <text x="1140" y="425" class="body">左右の青箱</text>
  <text x="1495" y="425" class="metric" text-anchor="end" fill="#17824d">853 / 853</text>
  <text x="1140" y="485" class="body">遮蔽失効・再捕捉</text>
  <text x="1495" y="485" class="metric" text-anchor="end" fill="#17824d">2 / 2</text>
  <line x1="1140" y1="525" x2="1495" y2="525" stroke="#d0eadb" stroke-width="2"/>
  <text x="1140" y="580" class="body">全6試行の実効FPS</text>
  <text x="1495" y="580" class="metric" text-anchor="end" fill="#17824d">30±1%</text>
  <text x="1140" y="635" class="body">有効処理時間p95</text>
  <text x="1495" y="635" class="metric" text-anchor="end" fill="#17824d">≤27.05 ms</text>
  <rect x="1140" y="680" width="355" height="47" rx="23" fill="#dff5e9"/>
  <text x="1318" y="712" class="body" text-anchor="middle" fill="#187044">静的な開発確認を完了</text>

  <rect x="350" y="755" width="900" height="58" rx="29" fill="#e9f1fb"/>
  <text x="800" y="793" class="body" text-anchor="middle" fill="#24568f">注意：本番設定への昇格と動的TTC評価は、今後の独立検証項目</text>
</svg>
